<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЛР1 – Менеджер заявок на доступ до лабораторії</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="main.js" defer></script>
</head>

<div id="confirmPopover" class="confirm-popover" hidden>
  <span class="confirm-text">Видалити запис?</span>
  <div class="confirm-actions">
    <button type="button" class="confirm-btn" data-confirm="yes" title="Підтвердити">Ок</button>
    <button type="button" class="confirm-btn" data-confirm="no" title="Скасувати">Не ок</button>
  </div>
</div>

<body>
  <header class="container">
    <h1>Менеджер заявок на доступ до лабораторії</h1>
    <p class="muted">
      ЛР1: CRUD-мінімум для сутності <strong>Users</strong>.
    </p>
  </header>

  <main class="container">
    <section class="card" id="create-section">
      <h2>Додати користувача</h2>

      <form id="userForm" novalidate>
        <div class="field">
          <label for="fullNameInput">Ім’я / ПІБ</label>
          <input
            id="fullNameInput"
            name="fullName"
            type="text"
            placeholder="Напр., Павло Іваненко"
            required
            minlength="3"
            maxlength="60"
            autocomplete="name"
          />
          <p class="error-text" id="fullNameError"></p>
        </div>

        <div class="field">
          <label for="emailInput">Email</label>
          <input
            id="emailInput"
            name="email"
            type="email"
            placeholder="name@example.com"
            required
            maxlength="80"
            autocomplete="email"
          />
          <p class="error-text" id="emailError"></p>
        </div>

        <div class="field">
          <label for="roleSelect">Роль</label>
          <select id="roleSelect" name="role" required>
            <option value="">Оберіть роль</option>
            <option value="Студент">Студент</option>
            <option value="Викладач">Викладач</option>
            <option value="Гість">Гість</option>
          </select>
          <p class="error-text" id="roleError"></p>
        </div>

        <div class="field">
          <label for="notesInput">Коментар (необов’язково)</label>
          <textarea
            id="notesInput"
            name="notes"
            rows="4"
            maxlength="300"
            placeholder="Напр., потрібен доступ до хім. лабораторії на 2 години"
          ></textarea>
          <p class="error-text" id="notesError"></p>
        </div>

        <div class="buttons">
          <button type="submit" id="submitBtn">Додати</button>
          <button type="button" id="resetBtn">Очистити</button>
        </div>
      </form>
    </section>

    <section class="card" id="list-section" aria-live="polite">
      <h2>Список користувачів</h2>

      <table id="usersTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Ім’я</th>
            <th>Email</th>
            <th>Роль</th>
            <th>Коментар</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
        </tbody>
      </table>

      <p class="muted" id="emptyState">
        Поки що немає записів. Додайте першого користувача.
      </p>
    </section>

  </main>
</body>
</html>
